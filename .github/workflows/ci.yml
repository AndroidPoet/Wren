name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Format and licence headers
        run: ./gradlew spotlessCheck --no-daemon
      - name: Unit tests
        run: ./gradlew testDebugUnitTest --no-daemon
      - name: Blocker benchmark (informational)
        run: ./gradlew :app:testDebugUnitTest --tests '*BlockerBenchmark*' -Dwren.bench=true -i --no-daemon | grep -i "ns/request" || true
